# GitHub Action: DebtLens quality gate.  In another repository:
#   - uses: surajhdeshpande1/debtlens@v2
#     with: { project: 3, max-open-critical: 0 }
#     env: { DEBTLENS_URL: https://debtlens-bec.vercel.app, DEBTLENS_TOKEN: ${{ secrets.DEBTLENS_TOKEN }} }
name: DebtLens quality gate
description: Push a git-history scan to DebtLens and fail the build when incident/debt risk crosses your limits.
branding: { icon: shield, color: blue }
inputs:
  project: { description: DebtLens project id, required: false, default: "" }
  scenario: { description: Run offline on a bundled scenario instead (fintech, healthtech, ecommerce, college, self), required: false, default: "" }
  push-scan: { description: Upload a scan of this repository first, required: false, default: "true" }
  max-open-critical: { description: Open critical incidents allowed, required: false, default: "0" }
  max-regressions: { description: Regressions allowed in the last 30 days, required: false, default: "" }
  max-break-even: { description: Debts past break-even allowed, required: false, default: "" }
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install --quiet "typer>=0.12" "rich>=13"
    - shell: bash
      if: ${{ inputs.project != '' && inputs.push-scan == 'true' }}
      run: python -m debtlens scan . --push --project "${{ inputs.project }}" --top 5
      env: { PYTHONPATH: "${{ github.action_path }}" }
    - shell: bash
      run: |
        args=(--max-open-critical "${{ inputs.max-open-critical }}")
        [ -n "${{ inputs.max-regressions }}" ] && args+=(--max-regressions "${{ inputs.max-regressions }}")
        [ -n "${{ inputs.max-break-even }}" ] && args+=(--max-break-even "${{ inputs.max-break-even }}")
        if [ -n "${{ inputs.scenario }}" ]; then args+=(--scenario "${{ inputs.scenario }}"); elif [ -n "${{ inputs.project }}" ]; then args+=(--project "${{ inputs.project }}"); fi
        python -m debtlens ci "${args[@]}"
      env: { PYTHONPATH: "${{ github.action_path }}" }
